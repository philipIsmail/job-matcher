name: Daily Job Match

on:
  schedule:
    # Runs at 12:00 UTC every day (~8am ET / 7am ET during DST offset - adjust as needed)
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

permissions:
  contents: write   # needed so the workflow can commit the updated dashboard back to the repo

jobs:
  run-matcher:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job matcher
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python main.py

      - name: Commit updated dashboard
        run: |
          git config user.name "job-matcher-bot"
          git config user.email "actions@github.com"
          git add docs/index.html
          git diff --quiet --cached || git commit -m "Update daily job matches"
          git push
